<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIMIR</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10140f;
      --panel: #1a2218;
      --line: #31402c;
      --text: #e7f0e2;
      --muted: #a8bba3;
      --accent: #c6f27a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.45;
      background: var(--bg);
      color: var(--text);
    }
    main {
      width: min(880px, 100%);
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); margin: 0 0 8px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .status {
      display: inline-block;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 16px 0 24px;
    }
    button {
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #15200f;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    article {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }
    article strong { display: block; margin-bottom: 4px; }
    @media (min-width: 720px) {
      .actions { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <p class="muted">Reseau de capsule</p>
    <h1>MIMIR</h1>
    <p>Ecoute les alertes d'EIR et publie un marqueur de demonstration vers l'infirmerie. Aucune donnee medicale ne transite.</p>
    <div class="status" id="status">Connexion au broker...</div>
    <div class="actions">
      <button type="button" data-alert="suricata_match">Publier alerte infirmerie</button>
      <button type="button" data-alert="stock_tampering">Signaler un ecart de stock</button>
      <button type="button" data-alert="wan_down">Signaler le lien Terre coupe</button>
      <button type="button" data-alert="broker_recovered">Signaler le broker revenu</button>
    </div>
    <h2>Messages du bus</h2>
    <div id="feed"><p class="muted">En attente.</p></div>
  </main>
  <script>
    const status = document.getElementById("status");
    const feed = document.getElementById("feed");

    function render(state) {
      status.textContent = state.connected
        ? "Broker local joignable. File en attente : " + state.pending
        : "Broker indisponible. Les alertes restent dans la file (" + state.pending + ").";
      if (!state.events.length) {
        feed.innerHTML = "<p class='muted'>Aucun message pour l'instant. Declenche une rupture ou une crise dans EIR.</p>";
        return;
      }
      feed.innerHTML = state.events.map((event) => {
        const body = document.createElement("article");
        const title = document.createElement("strong");
        title.textContent = event.topic;
        const text = document.createElement("p");
        text.textContent = JSON.stringify(event.payload);
        body.append(title, text);
        return body.outerHTML;
      }).join("");
    }

    async function refresh() {
      const response = await fetch("/api/state");
      render(await response.json());
    }

    document.querySelectorAll("button[data-alert]").forEach((button) => {
      button.addEventListener("click", async () => {
        button.disabled = true;
        await fetch("/api/alerts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ alert: button.dataset.alert }),
        });
        button.disabled = false;
        refresh();
      });
    });

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
